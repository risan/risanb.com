name: Update GitHub Contributions

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Refresh contribution snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest GitHub activity
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: GH_PAT secret is missing or empty. Please set secrets.GH_PAT in repo settings."
            exit 1
          fi
          node scripts/fetch-github-contributions.mjs

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/github-contributions.json; then
            echo "No changes in contribution data."
          else
            git add src/data/github-contributions.json
            git commit -m "chore(data): update github contributions"
            git push origin main
          fi
