name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # astro check + vue-tsc. Catches a mistyped prop or a Vue template error.
      # `npm run build` deliberately skips it so deploys don't pay for it twice.
      - name: Type-check Astro and Vue
        run: npm run check

      # Astro keeps optimized images here. Resizing the ~680 content images
      # dominates a cold build, so a restored cache makes the build several
      # times faster. The prefix fallback reuses the previous cache after a
      # content change, so only new or changed images are processed again.
      - name: Cache optimized images
        uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ runner.os }}-${{ hashFiles('content/**', 'src/assets/**') }}
          restore-keys: astro-images-${{ runner.os }}-

      - name: Build
        run: npm run build:only

      # Pages exist, internal links resolve, the redirect map is well-formed and
      # does not shadow a real page, and all 250 pre-split URLs are either
      # served or redirected. See scripts/check-site.mjs.
      - name: Check pages, links and redirect map
        run: npm run check:site

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site
          path: dist
          retention-days: 7
