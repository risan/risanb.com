<svg viewBox="0 0 32 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clipGrad" x1="6" y1="2" x2="26" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4DAE3" />
      <stop offset="40%" stop-color="#9BA6B5" />
      <stop offset="70%" stop-color="#BAC3D0" />
      <stop offset="100%" stop-color="#737E8E" />
    </linearGradient>
  </defs>

  <style>
    @keyframes clippy-blink {
      0%, 88%, 100% { transform: scaleY(1); }
      94% { transform: scaleY(0.08); }
    }
    @keyframes clippy-brow {
      0%, 80%, 100% { transform: translateY(0); }
      86%, 94% { transform: translateY(-1px); }
    }
    .clippy-eyes {
      transform-origin: 16px 14px;
      animation: clippy-blink 3.6s infinite ease-in-out;
    }
    .clippy-brows {
      transform-origin: 16px 8px;
      animation: clippy-brow 3.6s infinite ease-in-out;
    }
  </style>

  <!-- Paperclip Wire Loop (Classic Clippy curve) -->
  <path d="M12 25V13C12 10.7909 13.7909 9 16 9C18.2091 9 20 10.7909 20 13V26C20 29.3137 17.3137 32 14 32C10.6863 32 8 29.3137 8 26V7C8 3.68629 10.6863 1 14 1C17.3137 1 20 3.68629 20 7V22" 
        stroke="url(#clipGrad)" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <!-- Inner wire 3D highlight line -->
  <path d="M8.8 24V7C8.8 4.1 11.1 1.8 14 1.8C16.9 1.8 19.2 4.1 19.2 7V20" 
        stroke="#FFFFFF" 
        stroke-width="0.8" 
        stroke-linecap="round"
        opacity="0.85"/>

  <!-- Eyebrows -->
  <g class="clippy-brows">
    <!-- Left eyebrow -->
    <path d="M10 7.5C11 6.2 13 6.4 14.5 7.2" stroke="#1A1918" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Right eyebrow (perked higher!) -->
    <path d="M17.5 6.2C19 5.2 21.2 5.6 22.5 7" stroke="#1A1918" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Big Googly Eyes -->
  <g class="clippy-eyes">
    <!-- Left eye white -->
    <ellipse cx="12.5" cy="12.5" rx="3.5" ry="4.2" fill="#FFFFFF" stroke="#1A1918" stroke-width="1"/>
    <!-- Left pupil -->
    <circle cx="13" cy="12.8" r="1.8" fill="#1A1918"/>
    <!-- Left catchlight -->
    <circle cx="12.2" cy="11.8" r="0.65" fill="#FFFFFF"/>

    <!-- Right eye white -->
    <ellipse cx="19.5" cy="12" rx="3.5" ry="4.2" fill="#FFFFFF" stroke="#1A1918" stroke-width="1"/>
    <!-- Right pupil -->
    <circle cx="19" cy="12.2" r="1.8" fill="#1A1918"/>
    <!-- Right catchlight -->
    <circle cx="18.2" cy="11.2" r="0.65" fill="#FFFFFF"/>
  </g>
</svg>
